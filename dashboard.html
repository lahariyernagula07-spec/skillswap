<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Dashboard | SkillSwap</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
    .dash-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
    .dash-top h1{color:var(--navy);margin:6px 0;font-size:clamp(28px,4vw,42px)}
    .dash-top p{color:var(--muted);margin:0;line-height:1.5}
    .dash-grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.4fr);gap:22px;align-items:start}
    .panel{background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:22px;box-shadow:0 8px 26px #15294a0b}
    .panel h2{font-size:20px;color:var(--navy);margin:0 0 18px}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .field label{font-size:13px;font-weight:700;color:#344054}
    .field input,.field select,.field textarea,.search-box{width:100%;padding:12px 13px;border:1px solid #cfd7e4;border-radius:9px;font:inherit;background:white;color:var(--ink)}
    .field textarea{min-height:90px;resize:vertical}
    .button{cursor:pointer;font-family:inherit}
    .form-note{min-height:22px;font-size:13px;line-height:1.45;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
    .form-note.error{color:#b42318}.form-note.success{color:#067647}
    .skill-tools{display:flex;gap:10px;margin-bottom:16px}.skill-tools input{flex:1;min-width:0}
    .skill-list{display:grid;gap:12px}
    .skill-card{border:1px solid #e0e6ef;border-radius:13px;padding:16px;background:#fff}
    .skill-card h3{margin:0 0 7px;color:#1d3558;font-size:18px}
    .skill-card p{margin:6px 0;color:#5a6474;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .skill-meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
    .pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#edf4ff;color:#2d5d9b}
    .request-form{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;margin-top:13px;align-items:start}
    .request-form input{min-width:0;width:100%;padding:10px;border:1px solid #cfd7e4;border-radius:8px;font:inherit;font-size:13px}
    .request-form .button{min-width:auto;min-height:40px;padding:9px 12px;font-size:12px}
    .empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cfd7e4;border-radius:12px}
    .top-link{color:var(--navy);font-weight:700;text-decoration:none}
    .top-link:hover{text-decoration:underline}
    @media(max-width:820px){.dash-grid{grid-template-columns:1fr}.request-form{grid-template-columns:1fr}.request-form .button{width:100%}}
  </style>
</head>
<body>
  <main class="dashboard">
    <div class="dash-top">
      <div>
        <div class="eyebrow"><span class="accent-bar"></span> SKILLSWAP / CAMPUS SKILL EXCHANGE</div>
        <h1>Skill Dashboard</h1>
        <p>Browse skills and add your own. This page reads and writes data through your local Express API.</p>
      </div>
      <a class="top-link" href="index.html">← Back to project cover</a>
    </div>
    <div class="dash-grid">
      <section class="panel">
        <h2>Offer or request a skill</h2>
        <form id="skill-form">
          <div class="field"><label for="skill-name">Skill name *</label><input id="skill-name" name="name" required maxlength="100" placeholder="e.g. Java basics"></div>
          <div class="field"><label for="skill-category">Category *</label><select id="skill-category" name="category" required><option value="">Choose a category</option><option>Programming</option><option>Design</option><option>Communication</option><option>Video Editing</option><option>Photography</option><option>Academic</option><option>Other</option></select></div>
          <div class="field"><label for="skill-description">Description</label><textarea id="skill-description" name="description" maxlength="500" placeholder="What can you teach or what do you want to learn?"></textarea></div>
          <div class="field"><label for="skill-student">Your name</label><input id="skill-student" name="offeredBy" maxlength="100" placeholder="Enter your name"></div>
          <div class="field"><label for="skill-type">Listing type</label><select id="skill-type" name="type"><option value="offer">I can teach this (offer)</option><option value="wanted">I want to learn this (wanted)</option></select></div>
          <button class="button primary" type="submit">Save skill</button>
          <div id="skill-note" class="form-note" role="status" aria-live="polite"></div>
        </form>
      </section>
      <section class="panel">
        <h2>Available skills <span id="skill-count"></span></h2>
        <div class="skill-tools"><input class="search-box" id="skill-search" type="search" placeholder="Search skills or categories…" aria-label="Search skills"><button class="button secondary" id="refresh-skills" type="button">Refresh</button></div>
        <div id="skill-list" class="skill-list"><div class="empty">Loading skills from the backend…</div></div>
        <div id="list-note" class="form-note" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>
<script>
const API = '/api';
const skillList = document.getElementById('skill-list');
const skillNote = document.getElementById('skill-note');
const listNote = document.getElementById('list-note');
const searchInput = document.getElementById('skill-search');
let allSkills = [];
function note(el, message, type='') { el.textContent = message; el.className = 'form-note' + (type ? ' ' + type : ''); }
async function api(path, options={}) {
  const response = await fetch(API + path, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
  const data = response.status === 204 ? null : await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
  return data;
}
function escapeHtml(value='') { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
async function loadSkills() {
  skillList.innerHTML = '<div class="empty">Loading skills…</div>';
  note(listNote, '');
  try {
    allSkills = await api('/skills');
    renderSkills();
  } catch (error) {
    skillList.innerHTML = '<div class="empty">Could not load skills. Make sure the Node.js server is running at localhost:3000.</div>';
    note(listNote, error.message, 'error');
  }
}
function renderSkills() {
  const q = searchInput.value.trim().toLowerCase();
  const skills = allSkills.filter(s => `${s.name} ${s.category} ${s.description} ${s.offeredBy}`.toLowerCase().includes(q));
  document.getElementById('skill-count').textContent = `(${skills.length})`;
  if (!skills.length) { skillList.innerHTML = '<div class="empty">No matching skills yet. Add one using the form.</div>'; return; }
  skillList.innerHTML = skills.map(s => `
    <article class="skill-card">
      <h3>${escapeHtml(s.name)}</h3>
      <div class="skill-meta"><span class="pill">${escapeHtml(s.category)}</span><span class="pill">${s.type === 'wanted' ? 'Wants to learn' : 'Can teach'}</span></div>
      <p>${escapeHtml(s.description || 'No description provided.')}</p>
      <p><strong>Student:</strong> ${escapeHtml(s.offeredBy || 'Student')} </p>
      <form class="request-form" data-skill-id="${escapeHtml(s.id)}">
        <input name="from" maxlength="100" required placeholder="Your name" aria-label="Your name for request">
        <input name="message" maxlength="500" placeholder="Message (optional)" aria-label="Optional request message">
        <button class="button secondary" type="submit">Request exchange</button>
      </form>
    </article>`).join('');
  skillList.querySelectorAll('.request-form').forEach(form => form.addEventListener('submit', sendRequest));
}
document.getElementById('skill-form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const fields = new FormData(form);
  const payload = Object.fromEntries(fields.entries());
  payload.name = payload.name.trim(); payload.category = payload.category.trim();
  if (!payload.offeredBy.trim()) payload.offeredBy = 'Anonymous student';
  const submit = form.querySelector('button[type="submit"]'); submit.disabled = true; submit.textContent = 'Saving…';
  try {
    const created = await api('/skills', { method: 'POST', body: JSON.stringify(payload) });
    note(skillNote, `Saved “${created.name}” to the backend.`, 'success');
    form.reset(); await loadSkills();
  } catch (error) { note(skillNote, error.message, 'error'); }
  finally { submit.disabled = false; submit.textContent = 'Save skill'; }
});
async function sendRequest(event) {
  event.preventDefault();
  const form = event.currentTarget; const button = form.querySelector('button');
  const fields = new FormData(form);
  const payload = { from: String(fields.get('from') || '').trim(), message: String(fields.get('message') || '').trim(), skillId: form.dataset.skillId };
  button.disabled = true; button.textContent = 'Sending…';
  try {
    const result = await api('/requests', { method: 'POST', body: JSON.stringify(payload) });
    button.textContent = 'Request sent';
    note(listNote, `Exchange request saved with status “${result.status}”.`, 'success');
    form.reset();
  } catch (error) { button.disabled = false; button.textContent = 'Request exchange'; note(listNote, error.message, 'error'); }
}
searchInput.addEventListener('input', renderSkills);
document.getElementById('refresh-skills').addEventListener('click', loadSkills);
loadSkills();
</script>
</body>
</html>
